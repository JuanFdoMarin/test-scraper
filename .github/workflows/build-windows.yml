name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construir ejecutable
        run: |
          pyinstaller --onefile --name ScraperInmuebles --clean `
            --hidden-import=playwright.sync_api `
            --hidden-import=bs4 `
            --hidden-import=lxml `
            --hidden-import=lxml.etree `
            --hidden-import=lxml._elementpath `
            --hidden-import=pandas `
            --hidden-import=pandas._libs.tslibs.base `
            --hidden-import=pandas._libs.tslibs.np_datetime `
            --hidden-import=pandas._libs.tslibs.nattype `
            --hidden-import=pandas._libs.tslibs.timedeltas `
            --hidden-import=pandas._libs.tslibs.timestamps `
            --hidden-import=pandas._libs.reduction `
            --hidden-import=numpy `
            --collect-all=playwright `
            --collect-all=pandas `
            main.py

      - name: Subir ejecutable como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScraperInmuebles-Windows
          path: dist/ScraperInmuebles.exe
          retention-days: 30
